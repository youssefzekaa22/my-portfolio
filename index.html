ofileImageAlt:`Portrait of Youssef Zakaria Fahmy`},v={paragraphs:[`I'm a Computer Science graduate (Future Academy Higher Institute of Technology, 2025) who moved into DevOps and then into its security side. My graduation project was an AI-powered system that matches job seekers with relevant openings. Since then my focus has been on how software gets built, shipped, and kept safe once it's running.`,`At the National Telecommunication Institute (NTI) I work on secure CI/CD: Jenkins and ArgoCD pipelines with Snyk, OWASP ZAP, and GitLeaks wired in, plus Kubernetes hardening through RBAC, network policies, Secrets, and Ingress troubleshooting. In parallel I'm a DevOps intern in Route's training program, working through Linux, Docker, Kubernetes, Jenkins, Ansible, Terraform, and AWS in hands-on labs.`,`What I've built so far: a microservices platform behind a single Traefik entry point, migrated from Docker Compose to Kubernetes with StatefulSets, a PVC per pod, probes, and resource limits; a Flask app taken the same way from Compose to Kubernetes; an Arabic DevOps course site that runs on the Kubernetes setup it teaches; and Bash tools for backups and data processing. I learn fastest by building, breaking, and writing down what broke.`],strengths:[`Approaches technical problems creatively and turns them into working projects.`,`Builds security into the pipeline instead of bolting it on after.`,`Communicates clearly and documents the why, not just the how.`,`Focuses on reliable, repeatable workflows.`,`Learns quickly by applying new tools in hands-on labs.`],languages:[{name:`Arabic`,level:`Native`},{name:`English`,level:`B2`}]},y={degree:`Bachelor's Degree in Computer Science`,school:`Future Academy Higher Institute of Technology`,year:`2025`,project:{title:`Smart System Aided for Job Seekers and HR`,description:`An AI-powered system that matches job seekers with relevant opportunities using machine learning.`}};function b(e){let[t,n]=(0,l.useState)(``);return(0,l.useE
